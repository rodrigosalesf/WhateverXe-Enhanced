name: CI

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-e1:
    if: github.repository == 'rodrigosalesf/WhateverXe-Enhanced' && github.ref == 'refs/heads/publish-e1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '45579212319'
      BUILD_COMMIT: '639971e956546bc08bc57244ba6eac8915130581'
      RELEASE_TAG: 'v0.8.5-enhanced-e1'
    steps:
      - name: Verify successful source build
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json headSha,conclusion,status | jq -e --arg sha "$BUILD_COMMIT" '.headSha == $sha and .status == "completed" and .conclusion == "success"'
      - name: Download and verify existing packages
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name Artifacts --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*DEBUG*.zip' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*RELEASE*.zip' | wc -l)" -eq 1
      - name: Publish experimental prerelease
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## WhateverXe Enhanced E1 — experimental
          Based on upstream WhateverXe 0.8.5; includes more precise sleepable delays, bounded clock/PCODE waits, safer eDP panel-status checks, and regression tests.

          DEBUG and RELEASE were built successfully by GitHub Actions. These are the original packages from run #45579212319, with SHA256SUMS. No real-hardware or macOS Tahoe runtime validation has been completed. Use a separate test EFI and keep a recovery option.
          
          Build: https://github.com/rodrigosalesf/WhateverXe-Enhanced/actions/runs/45579212319
          Source: 639971e956546bc08bc57244ba6eac8915130581
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --target "$BUILD_COMMIT" --title "WhateverXe Enhanced E1 (0.8.5)" --prerelease --notes-file release-notes.md
