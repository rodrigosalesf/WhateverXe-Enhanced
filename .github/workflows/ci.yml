name: CI

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-e2:
    if: github.repository == 'rodrigosalesf/WhateverXe-Enhanced' && github.ref == 'refs/heads/publish-e2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '45584656288'
      BUILD_COMMIT: 'b0ceed7c535e07b2299ced8f773b4c200c5b4ff9'
      RELEASE_TAG: 'v0.8.5-enhanced-e2'
    steps:
      - name: Verify successful source build
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN" --json headSha,conclusion,status | jq -e --arg sha "$BUILD_COMMIT" '.headSha == $sha and .status == "completed" and .conclusion == "success"'
      - name: Download and verify existing packages
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name Artifacts --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*DEBUG*.zip' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*RELEASE*.zip' | wc -l)" -eq 1
      - name: Publish experimental prerelease
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## WhateverXe Enhanced E2 — Hardware Intelligence

          Experimental prerelease based on upstream WhateverXe 0.8.5, including all E1 stability improvements.

          ### Changes
          - Additional aligned and bounded MMIO validation for selected adapters.
          - Consistent DSM reservation snapshots; revoke stale reservations on failed refresh.
          - EDRAM preflight and output invalidation on failed sampling.
          - PCI identity, mobile GT topology, ForceWake and framebuffer hook diagnostics in IORegistry.
          - Explicit rejection reasons for incompatible slice, DSS, EU, media and L3 configurations.
          - Regression tests, including a modeled 48-EU configuration and corrected ADL-P load-only diagnostic fixture.
          - Existing hardware admission policy and provider ABI3 preserved.

          ### Validation
          The complete CI test step, DEBUG build, RELEASE build and packaging succeeded in run #45584656288. Packages are reused from that run and verified against SHA256SUMS before publication. No physical hardware qualification, Metal performance gain or Tahoe runtime compatibility is claimed.

          Use a separate test EFI and retain a recovery option.

          Build: https://github.com/rodrigosalesf/WhateverXe-Enhanced/actions/runs/45584656288
          Source: b0ceed7c535e07b2299ced8f773b4c200c5b4ff9
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --target "$BUILD_COMMIT" --title "WhateverXe Enhanced E2 (0.8.5)" --prerelease --notes-file release-notes.md
