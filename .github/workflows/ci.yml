name: CI

on:
  push:
    branches: [main, enhanced-e5]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  hdmi-reference-abi:
    name: HDMI reference ABI audit (read only)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Audit pinned Sequoia framebuffer and available host AppleHDA binaries
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p build/hdmi-reference-abi
          donor="$tmp/AppleIntelTGLGraphicsFramebuffer"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 --output "$donor" \
            'https://raw.githubusercontent.com/b00t0x/WhateverXe-Graphics/a558c561e06b2f78d675d16dd8f4303bf1c33fad/payloads/Sequoia/Library/Extensions/AppleIntelTGLGraphicsFramebuffer.kext/Contents/MacOS/AppleIntelTGLGraphicsFramebuffer'
          test "$(git hash-object "$donor")" = '74baffa1f0ba577ae1c22345fd6011c1ca2d3863'
          # Inventory candidate names only, never qualify ABI from names.
          xcrun nm -j "$donor" > "$tmp/framebuffer-symbols.txt"
          python3 - "$tmp/framebuffer-symbols.txt" <<'PY'
          import json
          import sys
          from pathlib import Path
          names = Path(sys.argv[1]).read_text().splitlines()
          candidates = ("hwSetPowerWellStatePG", "restorePowerWellsState",
                        "hwEnableAudio", "hwDisableAudio", "setAudioProperties",
                        "IsDisplayAudioSupported")
          # Inventory DC/DMC entry points without assuming their signatures.
          dc_names = sorted({name for name in names
                             if any(token in name.lower() for token in
                                    ("dcstate", "dc_state", "dc5", "dc6", "dmc",
                                     "displaycstate", "displayc_state", "powerwell"))})
          Path("build/hdmi-reference-abi/dc-symbols.json").write_text(
              json.dumps({"kernel_activation_authorized": False,
                          "qualification": "name inventory only",
                          "symbols": dc_names}, indent=2) + "\n")
          print("DC/DMC candidates:", json.dumps(dc_names))
          report = {"kernel_activation_authorized": False,
                    "qualification": "name inventory only",
                    "candidates": {key: sorted({name for name in names if key in name})
                                   for key in candidates}}
          Path("build/hdmi-reference-abi/power-symbols.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          hda='/System/Library/Extensions/AppleHDA.kext/Contents'
          rc=0
          python3 tools/hdmi_audio_abi.py \
            --controller "$hda/PlugIns/AppleHDAController.kext/Contents/MacOS/AppleHDAController" \
            --applehda "$hda/MacOS/AppleHDA" --framebuffer "$donor" \
            > build/hdmi-reference-abi/reference.json || rc=$?
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then
            exit "$rc"
          fi
          # Exit 1 is an honest non-match/unavailable observation, not a pipeline fault.
          # A successfully executed audit is not an ABI compatibility approval.
          python3 - "$rc" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          path = Path("build/hdmi-reference-abi/reference.json")
          report = json.loads(path.read_text())
          if report.get("schema") != 1 or report.get("kernel_activation_authorized") is not False:
              raise SystemExit("unexpected ABI report schema")
          if set(report.get("images", {})) != {"controller", "applehda", "framebuffer"}:
              raise SystemExit("missing ABI audit results")
          report["reference_provenance"] = {
              "framebuffer_repository": "b00t0x/WhateverXe-Graphics",
              "framebuffer_commit": "a558c561e06b2f78d675d16dd8f4303bf1c33fad",
              "framebuffer_git_blob": "74baffa1f0ba577ae1c22345fd6011c1ca2d3863",
              "host_product_version": subprocess.check_output(["/usr/bin/sw_vers", "-productVersion"], text=True).strip(),
              "host_build_version": subprocess.check_output(["/usr/bin/sw_vers", "-buildVersion"], text=True).strip(),
              "audit_exit_code": int(sys.argv[1]),
              "target_hardware_verified": False,
          }
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(path.read_text())
          PY
      - name: Upload ABI reference results (JSON only)
        uses: actions/upload-artifact@v6
        with:
          name: HDMI-reference-ABI
          path: build/hdmi-reference-abi/*.json
          if-no-files-found: error

  build:
    name: Test and build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: build/dependencies/Lilu
          persist-credentials: false
      - name: Prepare Lilu development files
        shell: bash
        run: |
          mkdir -p Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Headers" Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Library" Lilu.kext/Contents/Resources/Library
      - name: Quality Gate - Python and workflow lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/quality-venv
          build/quality-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps ruff==0.11.13
          build/quality-venv/bin/ruff --version
          for module in hdmi_audio_probe hdmi_audio_abi hdmi_hotplug_replay gpu_telemetry_probe gpu_frequency_probe gpu_rc6_probe display_power_probe frame_pacing_probe gpu_memory_probe install_preflight; do
            build/quality-venv/bin/ruff check "tools/$module.py" "tests/$module.py"
          done
          build/quality-venv/bin/ruff check tests/xelp_flight_recorder_mutants.py
          mkdir -p build/quality-bin
          # Use the exact upstream Intel macOS release instead of assuming Go is installed.
          archive=build/quality-bin/actionlint.tar.gz
          curl --fail --location --silent --show-error --retry 3 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_darwin_amd64.tar.gz
          printf '%s  %s\n' '17ffc17fed8f0258ef6ad4aed932d3272464c7ef7d64e1cb0d65aa97c9752107' "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C build/quality-bin actionlint
          build/quality-bin/actionlint -version
          build/quality-bin/actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml
      - name: Quality Gate - C++ host analysis
        shell: bash
        run: |
          set -euo pipefail
          tidy="$(brew --prefix llvm@18)/bin/clang-tidy"
          "$tidy" --version
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$tidy" tests/xelp_flight_recorder.cpp -- -std=c++17 -isysroot "$sdk"
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsyntax-only tests/xelp_flight_recorder.cpp
          "$tidy" tests/hdmi_audio_payload.cpp -- -std=c++17 -IWhateverXe -isysroot "$sdk"
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IWhateverXe -fsyntax-only tests/hdmi_audio_payload.cpp
      - name: HDMI EDID offline tests
        shell: bash
        run: |
          set -euo pipefail
          build/quality-venv/bin/ruff check tools/hdmi_edid_probe.py
          python3 tools/hdmi_edid_probe.py -v
          build/quality-venv/bin/ruff check tools/hdmi_abi_readiness.py
          python3 tools/hdmi_abi_readiness.py -v
          build/quality-venv/bin/ruff check tools/hdmi_route_model.py
          python3 tools/hdmi_route_model.py -v
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/hdmi_route_model.cpp -o build/quality-bin/hdmi-route-model
          build/quality-bin/hdmi-route-model
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/hdmi_wake_plan.cpp -o build/quality-bin/hdmi-wake-plan
          build/quality-bin/hdmi-wake-plan
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/hdmi_mmio_guard.cpp -o build/quality-bin/hdmi-mmio-guard
          build/quality-bin/hdmi-mmio-guard
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/hdmi_wake_transaction.cpp -o build/quality-bin/hdmi-wake-transaction
          build/quality-bin/hdmi-wake-transaction
          bash -n tools/collect-hdmi-state.sh
          bash -n tools/validate-e53.sh
      - name: CPU tests
        run: >-
          python3 tools/test.py
          --require hdmi_audio_probe
          --require hdmi_audio_payload
          --require hdmi_audio_abi
          --require hdmi_hotplug_replay
          --require gpu_telemetry_probe
          --require gpu_frequency_probe
          --require gpu_rc6_probe
          --require display_power_probe
          --require display13_power_dispatch
          --require display13_wake_notifications
          --require display13_shared_restore
          --require frame_pacing_probe
          --require gpu_memory_probe
          --require xelp_flight_recorder
          --require xelp_flight_recorder_mutants
          --require install_preflight
      - name: Compile Metal diagnostics (no GPU execution on CI)
        run: |
          mkdir -p build/diagnostics
          xcrun swiftc -swift-version 5 -target x86_64-apple-macos11.0 tools/metal_probe.swift -o build/diagnostics/metal_probe
      - name: Verify Metal diagnostic host-only logic
        shell: bash
        run: |
          set -euo pipefail
          probe=build/diagnostics/metal_probe
          "$probe" --self-test
          for n in 0 1001 invalid; do
            status=0
            "$probe" --iterations "$n" || status=$?
            test "$status" -eq 2
          done
          status=0
          "$probe" --iterations 1 --iterations 2 || status=$?
          test "$status" -eq 2
          for suite in invalid "" Metal3; do
            status=0
            "$probe" --suite "$suite" || status=$?
            test "$status" -eq 2
          done
          status=0
          "$probe" --suite advanced --suite standard || status=$?
          test "$status" -eq 2
      - name: Build DEBUG
        run: python3 tools/build.py --output build/DEBUG
      - name: Build RELEASE
        run: python3 tools/build.py --release --output build/RELEASE
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 tools/package.py --build build/DEBUG --configuration DEBUG --tag "$RELEASE_TAG"
          python3 tools/package.py --build build/RELEASE --configuration RELEASE --tag "$RELEASE_TAG"
          cd build/dist
          shasum -a 256 *.zip > SHA256SUMS
      - name: Package E5.3 validation kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/e53/tools
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror tools/hdmi_codec_reader.cpp \
            -framework IOKit -framework CoreFoundation -o build/e53/tools/hdmi_codec_reader
          cp build/diagnostics/metal_probe tools/validate-e53.sh build/e53/tools/
          cp docs/E5.3-validation.md build/e53/
          git rev-parse HEAD > build/e53/commit.txt
          for archive in build/dist/WhateverXe-*.zip; do
            unzip -p "$archive" WhateverXe.kext/Contents/MacOS/WhateverXe | shasum -a 256 |
              awk -v name="$(basename "$archive")" '{print $1, name}' >> build/e53/kext-sha256.txt
          done
          (cd build/e53 && zip -qr ../e53-validation.zip .)
      - uses: actions/upload-artifact@v6
        with:
          name: E5.3-validation
          path: build/e53-validation.zip
          if-no-files-found: error
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: Artifacts
          path: build/dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test-results
          path: |
            build/tests/**/test.log
            build/tests/**/results.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'b00t0x/WhateverXe'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: Artifacts
          path: dist
      - name: Attach verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,body \
              --jq 'select(.isDraft == true) | .body' > release-notes.md && test -s release-notes.md; then
            : # Preserve release text explicitly supplied with the draft.
          else
            python3 tools/release_notes.py "$RELEASE_TAG" > release-notes.md
          fi
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            test "$(cat release-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file ../release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file ../release-notes.md
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
