name: CI

on:
  push:
    branches: [main, enhanced-e5]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: build/dependencies/Lilu
          persist-credentials: false
      - name: Prepare Lilu development files
        shell: bash
        run: |
          mkdir -p Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Headers" Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Library" Lilu.kext/Contents/Resources/Library
      - name: Quality Gate - Python and workflow lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/quality-venv
          build/quality-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps ruff==0.11.13
          build/quality-venv/bin/ruff --version
          for module in hdmi_audio_probe hdmi_hotplug_replay gpu_telemetry_probe gpu_frequency_probe gpu_rc6_probe display_power_probe frame_pacing_probe gpu_memory_probe install_preflight; do
            build/quality-venv/bin/ruff check "tools/$module.py" "tests/$module.py"
          done
          build/quality-venv/bin/ruff check tests/xelp_flight_recorder_mutants.py
          mkdir -p build/quality-bin
          # Use the exact upstream Intel macOS release instead of assuming Go is installed.
          archive=build/quality-bin/actionlint.tar.gz
          curl --fail --location --silent --show-error --retry 3 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_darwin_amd64.tar.gz
          printf '%s  %s\n' '17ffc17fed8f0258ef6ad4aed932d3272464c7ef7d64e1cb0d65aa97c9752107' "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C build/quality-bin actionlint
          build/quality-bin/actionlint -version
          build/quality-bin/actionlint -shellcheck= -pyflakes= .github/workflows/ci.yml
      - name: Quality Gate - C++ host analysis
        shell: bash
        run: |
          set -euo pipefail
          tidy="$(brew --prefix llvm@18)/bin/clang-tidy"
          "$tidy" --version
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$tidy" tests/xelp_flight_recorder.cpp -- -std=c++17 -isysroot "$sdk"
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsyntax-only tests/xelp_flight_recorder.cpp
          "$tidy" tests/hdmi_audio_payload.cpp -- -std=c++17 -IWhateverXe -isysroot "$sdk"
          xcrun clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IWhateverXe -fsyntax-only tests/hdmi_audio_payload.cpp
      - name: CPU tests
        run: >-
          python3 tools/test.py
          --require hdmi_audio_probe
          --require hdmi_audio_payload
          --require hdmi_hotplug_replay
          --require gpu_telemetry_probe
          --require gpu_frequency_probe
          --require gpu_rc6_probe
          --require display_power_probe
          --require display13_shared_restore
          --require frame_pacing_probe
          --require gpu_memory_probe
          --require xelp_flight_recorder
          --require xelp_flight_recorder_mutants
          --require install_preflight
      - name: Compile Metal diagnostics (no GPU execution on CI)
        run: |
          mkdir -p build/diagnostics
          xcrun swiftc -swift-version 5 -target x86_64-apple-macos11.0 tools/metal_probe.swift -o build/diagnostics/metal_probe
      - name: Verify Metal diagnostic host-only logic
        shell: bash
        run: |
          set -euo pipefail
          probe=build/diagnostics/metal_probe
          "$probe" --self-test
          for n in 0 1001 invalid; do
            status=0
            "$probe" --iterations "$n" || status=$?
            test "$status" -eq 2
          done
          status=0
          "$probe" --iterations 1 --iterations 2 || status=$?
          test "$status" -eq 2
          for suite in invalid "" Metal3; do
            status=0
            "$probe" --suite "$suite" || status=$?
            test "$status" -eq 2
          done
          status=0
          "$probe" --suite advanced --suite standard || status=$?
          test "$status" -eq 2
      - name: Build DEBUG
        run: python3 tools/build.py --output build/DEBUG
      - name: Build RELEASE
        run: python3 tools/build.py --release --output build/RELEASE
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 tools/package.py --build build/DEBUG --configuration DEBUG --tag "$RELEASE_TAG"
          python3 tools/package.py --build build/RELEASE --configuration RELEASE --tag "$RELEASE_TAG"
          cd build/dist
          shasum -a 256 *.zip > SHA256SUMS
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results
          path: |
            build/tests/**/test.log
            build/tests/**/results.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'b00t0x/WhateverXe'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: dist
      - name: Attach verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,body \
              --jq 'select(.isDraft == true) | .body' > release-notes.md && test -s release-notes.md; then
            : # Preserve release text explicitly supplied with the draft.
          else
            python3 tools/release_notes.py "$RELEASE_TAG" > release-notes.md
          fi
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            test "$(cat release-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file ../release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file ../release-notes.md
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
